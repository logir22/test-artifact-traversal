name: upload-test
on: workflow_dispatch

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir payload && echo "TRAVERSAL_MARKER" > payload/marker.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ".."
          path: payload/marker.txt

      - run: echo "normal" > normal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: "artefacto-normal"
          path: normal.txt
